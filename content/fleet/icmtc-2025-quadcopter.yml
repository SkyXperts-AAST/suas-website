slug: icmtc-2025-quadcopter
name: "ICMTC 2025 Quadcopter"
kind: multirotor
status: retired
seasons: [2024-25]
tagline: "Our first competition airframe, and the body Storm grew from"
summary: >-
  The team's first in-house competition airframe: a carbon-fibre X-quad with
  16-inch propellers, an OAK-D camera and a Raspberry Pi 5 with a Coral TPU for
  onboard flag detection. It reached 150 m and placed 2nd at ICMTC 2025, then
  was rebuilt around a new body to become Storm.
