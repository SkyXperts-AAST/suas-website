structure:
  - id: software
    name: Software
    teams:
      - id: computer-vision
        name: Computer Vision
        summary: >-
          How Storm sees. Stitches aerial footage into high-resolution maps and
          trains detection models that find a single target in a messy
          landscape while the drone is still moving.
        members: [yasmin-ahmed]
      - id: control
        name: Control & Navigation
        summary: >-
          The reflexes. Keeps Storm steady and on course, and makes the
          split-second calls during takeoff, landing and everything in between.
        members: [nour-allam, jana-el-wazzan, darine-elkilany, omar-abdrabo]
  - id: mechanical-dept
    name: Mechanical
    teams:
      - id: mechanical
        name: Mechanical
        summary: >-
          The airframe and structure everything bolts onto: light enough to fly,
          tough enough to survive landing after landing, and foldable to travel.
        members: [salma]
  - id: electrical-dept
    name: Electrical
    teams:
      - id: electrical
        name: Electrical
        summary: >-
          Power architecture for every subsystem: batteries sized correctly,
          clean wiring, and current where it's needed the moment it's needed.
  - id: outreach
    name: Outreach
    teams:
