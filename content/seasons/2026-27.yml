id: 2026-27
label: "2026–27"
current: true
title: "Building on Storm"
summary: >-
  A new intake joins through the training phase while the core team builds on
  Storm and Sonic and starts on a VTOL.
sponsors: [pcbway, makers, dassault, simnet, arabtech]
recruitment:
  open: false
  note: "Applications for 2026–27 are closed. The next intake opens at the start of next season."
milestones:
  - date: "Aug 2026"
    title: "Orientation and training phase"
    detail: "New members start with fundamentals, tools and safety before joining a sub-team."
  - date: "Sep 2026"
    title: "Alamein International Air Show"
    detail: "Third year at the air show."
  - date: "2026–27"
    title: "VTOL in development"
    detail: "A new VTOL aircraft is being built in-house."
leadership:
  - person: yehia-alaa
    role: Team Leader
  - person: nour-allam
    role: Software Head
# Mentors listed here appear on the Team page. Use { person, role } to give
# someone a role other than "Mentor".
