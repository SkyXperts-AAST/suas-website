# lead: a person id, or TBA. sharedWith: another department that co-owns a team.
# TODO: member rosters per sub-team (names need approval first).
structure:
  - id: software
    name: Software
    lead: nour-allam
    summary: "Flight software, perception and the team's own tools."
    teams:
      - id: control
        name: Control
        lead: darine-elkilany
        summary: >-
          Flight controller setup, PID tuning, waypoint navigation and
          ground-station operation.
      - id: computer-vision
        name: Computer Vision
        summary: >-
          Detection and vision models: the code that finds a target from the
          air, on board, in real time.
      - id: web-dev
        name: Website Development
        summary: "This website and the team's digital tools."
  - id: electrical
    name: Electrical
    lead: TBA
    summary: "Everything that powers, computes and communicates on board."
    teams:
      - id: electronics
        name: Electronics
        summary: "Power distribution, wiring and the boards that carry it."
      - id: systems
        name: Systems
        summary: "Integrating every electrical subsystem into one working aircraft."
      - id: embedded-systems
        name: Embedded Systems
        summary: "Firmware and microcontrollers for payloads and onboard hardware."
      - id: propulsion
        name: Propulsion System
        sharedWith: Mechanical
        summary: >-
          Motor, ESC, propeller and battery selection matched to mission weight
          and endurance. Owned jointly with Mechanical.
  - id: mechanical
    name: Mechanical
    lead: TBA
    summary: "Everything that has to survive the flight it is asked to make."
    teams:
      - id: aerodynamics
        name: Aerodynamics
        summary: >-
          Wing, tail and airframe shaping to improve lift and drag on
          fixed-wing and multirotor builds.
      - id: structural-design
        name: Structural Design
        summary: >-
          Fuselages, frames and mounts: strong enough to fly, light enough to
          lift.
      - id: propulsion
        name: Propulsion System
        sharedWith: Electrical
        summary: >-
          Thrust, mounting and airflow for the propulsion set. Owned jointly
          with Electrical.
  - id: marketing
    name: Marketing
    lead: TBA
    summary: "Funding, partnerships and the team's public voice."
    teams:
      - id: sponsorship-media
        name: Sponsorship & Social Media
        summary: "Sponsor relations, social channels and the content calendar."
